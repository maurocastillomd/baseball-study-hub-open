<svg xmlns="http://www.w3.org/2000/svg" width="400" height="844" viewBox="0 0 400 844" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">The evidence ladder for a model claim</title><desc id="graphic-description">The evidence ladder for a model claim. Definition: What does the model mean here?; Intervention: What work was actually delivered?; Outcome: What changed, in whom, under which method?; Transfer: Does that answer this baseball decision?</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Definition</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">What does the model mean here?</tspan></text><rect x="24.0" y="231" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="247" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="266" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="305" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Intervention</tspan></text><text x="43.0" y="350" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">What work was actually delivered?</tspan></text><rect x="24.0" y="438" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="454" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="473" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="512" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Outcome</tspan></text><text x="43.0" y="557" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">What changed, in whom, under</tspan><tspan x="43.0" dy="25">which method?</tspan></text><rect x="24.0" y="645" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="661" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="680" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">4</tspan></text><text x="43.0" y="719" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Transfer</tspan></text><text x="43.0" y="764" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Does that answer this baseball</tspan><tspan x="43.0" dy="25">decision?</tspan></text><path d="M200.0 203 L200.0 226" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,226.00 195.03,217.32 204.97,217.32" fill="#286149"/><path d="M200.0 410 L200.0 433" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,433.00 195.03,424.32 204.97,424.32" fill="#286149"/><path d="M200.0 617 L200.0 640" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,640.00 195.03,631.32 204.97,631.32" fill="#286149"/></svg>
