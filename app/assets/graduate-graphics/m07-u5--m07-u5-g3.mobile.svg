<svg xmlns="http://www.w3.org/2000/svg" width="400" height="448" viewBox="0 0 400 448" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Two different parts of disagreement</title><desc id="graphic-description">Two different parts of disagreement. Synthetic five-pair example: mean bias 1 cm; typical error about 1.118 cm. These are different quantities, both in centimeters.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="184" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Mean bias</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Retest−baseline average</tspan></text><text x="357.0" y="60" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">1</tspan></text><rect x="43.0" y="174" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="174" width="280.8586762075134" height="14" rx="5" fill="#286149" stroke="#286149"/><rect x="24.0" y="240" width="352.0" height="184" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="256" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="275" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="314" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Typical error</tspan></text><text x="43.0" y="359" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">SD of differences divided by √2</tspan></text><text x="357.0" y="276" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">1.118</tspan></text><rect x="43.0" y="390" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="390" width="314.0" height="14" rx="5" fill="#286149" stroke="#286149"/></svg>
