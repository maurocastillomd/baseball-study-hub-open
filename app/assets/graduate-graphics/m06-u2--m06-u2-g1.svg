<svg xmlns="http://www.w3.org/2000/svg" width="900" height="273" viewBox="0 0 900 273" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Different structures, common questions</title><desc id="graphic-description">Different structures, common questions. Shifting emphasis: Targets change over longer blocks; short-term variation can remain.; Undulating exposure: Selected demands vary within a shorter cycle.; Concentrated priority: A narrower target receives more resources; retained work must be explicit.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="262.6666666666667" height="225" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Shifting emphasis</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Targets change over</tspan><tspan x="43.0" dy="25">longer blocks; short-term</tspan><tspan x="43.0" dy="25">variation can remain.</tspan></text><rect x="318.6666666666667" y="24" width="262.6666666666667" height="225" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="336.6666666666667" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="353.6666666666667" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="353.6666666666667" dy="0">2</tspan></text><text x="337.6666666666667" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="337.6666666666667" dy="0">Undulating exposure</tspan></text><text x="337.6666666666667" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="337.6666666666667" dy="0">Selected demands vary</tspan><tspan x="337.6666666666667" dy="25">within a shorter cycle.</tspan></text><rect x="613.3333333333334" y="24" width="262.6666666666667" height="225" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="631.3333333333334" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="648.3333333333334" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="648.3333333333334" dy="0">3</tspan></text><text x="632.3333333333334" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="632.3333333333334" dy="0">Concentrated priority</tspan></text><text x="632.3333333333334" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="632.3333333333334" dy="0">A narrower target</tspan><tspan x="632.3333333333334" dy="25">receives more resources;</tspan><tspan x="632.3333333333334" dy="25">retained work must be</tspan><tspan x="632.3333333333334" dy="25">explicit.</tspan></text></svg>
