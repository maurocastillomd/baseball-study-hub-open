" dy="0">0.25 m moment arm</tspan></text><text x="43.0" y="359" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">200 × 0.25</tspan></text><text x="857.0" y="276" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="857.0" dy="0">50</tspan></text><rect x="43.0" y="390" width="814.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="390" width="678.3333333333334" height="14" rx="5" fill="#286149" stroke="#286149"/></svg>
