<svg xmlns="http://www.w3.org/2000/svg" width="400" height="844" viewBox="0 0 400 844" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Match repetitions to the question</title><desc id="graphic-description">Match repetitions to the question. Each design estimates a different scope of variation. They are not interchangeable.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Within session</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Repeat trials under one visit</tspan></text><rect x="24.0" y="231" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="247" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="266" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="305" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Between sessions</tspan></text><text x="43.0" y="350" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Repeat the session summary on</tspan><tspan x="43.0" dy="25">another occasion</tspan></text><rect x="24.0" y="438" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="454" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="473" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="512" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Between operators</tspan></text><text x="43.0" y="557" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Include the intended staff variation</tspan></text><rect x="24.0" y="645" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="661" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="680" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">4</tspan></text><text x="43.0" y="719" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Between devices</tspan></text><text x="43.0" y="764" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Study the instruments to be</tspan><tspan x="43.0" dy="25">compared</tspan></text></svg>
