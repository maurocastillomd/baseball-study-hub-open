<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">A changed value is only the first question</title><desc id="graphic-description">A changed value is only the first question. Comparable?: Same method, task and usable record?; Detectable?: How large is the difference relative to relevant error?; Important?: Would that magnitude matter for this objective?; Actionable?: Does current scope and context justify a change?</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="410.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Comparable?</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Same method, task and usable record?</tspan></text><rect x="466.0" y="24" width="410.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="484.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="501.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="501.0" dy="0">2</tspan></text><text x="485.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="485.0" dy="0">Detectable?</tspan></text><text x="485.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="485.0" dy="0">How large is the difference relative to</tspan><tspan x="485.0" dy="25">relevant error?</tspan></text><rect x="466.0" y="231" width="410.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="484.0" y="247" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="501.0" y="266" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="501.0" dy="0">3</tspan></text><text x="485.0" y="305" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="485.0" dy="0">Important?</tspan></text><text x="485.0" y="350" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="485.0" dy="0">Would that magnitude matter for this</tspan><tspan x="485.0" dy="25">objective?</tspan></text><rect x="24.0" y="231" width="410.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="247" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="266" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">4</tspan></text><text x="43.0" y="305" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Actionable?</tspan></text><text x="43.0" y="350" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Does current scope and context justify a</tspan><tspan x="43.0" dy="25">change?</tspan></text><path d="M437.0 111.5 L461.0 111.5" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="461.00,111.50 452.32,116.47 452.32,106.53" fill="#286149"/><path d="M671.0 203 L671.0 226" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="671.00,226.00 666.03,217.32 6