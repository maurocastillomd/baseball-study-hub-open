<svg xmlns="http://www.w3.org/2000/svg" width="400" height="739" viewBox="0 0 400 739" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">What fits when 45 minutes become 30?</title><desc id="graphic-description">What fits when 45 minutes become 30?. Preparation: Task-specific preparation retained.; Primary work: Named objective with its planned rest.; Secondary work: Omitted or reconsidered when access falls.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="209" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Preparation</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Task-specific preparation retained.</tspan></text><text x="357.0" y="60" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">10</tspan></text><rect x="43.0" y="199" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="199" width="157.0" height="14" rx="5" fill="#286149" stroke="#286149"/><rect x="24.0" y="265" width="352.0" height="209" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="281" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="300" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="339" fill="#202725" font-family="Ari