<svg xmlns="http://www.w3.org/2000/svg" width="900" height="273" viewBox="0 0 900 273" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Three options, three responsibilities</title><desc id="graphic-description">Three options, three responsibilities. Full: Deliver the named objective when the agreed window and scope fit.; Brief: Retain a specified task; name what is omitted.; Deferred: Record the reason and next decision time; do not create automatic debt.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="262.6666666666667" height="225" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Full</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Deliver the named</tspan><tspan x="43.0" dy="25">objective when the</tspan><tspan x="43.0" dy="25">agreed window and</tspan><tspan x="43.0" dy="25">scope fit.</tspan></text><rect x="318.6666666666667" y="24" width="262.6666666666667" height="225" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="336.6666666666667" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="353.6666666666667" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="353.6666666666667" dy="0">2</tspan></text><text x="337.6666666666667" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="337.6666666666667" dy="0">Brief</tspan></text><text x="337.6666666666667" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="337.6666666666667" dy="0">Retain a specified task;</tspan><tspan x="337.6666666666667" dy="25">name what is omitted.</tspan></text><rect x="613.3333333333334" y="24" width="262.6666666666667" height="225" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="631.3333333333334" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="648.3333333333334" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="648.3333333333334" dy="0">3</tspan></text><text x="632.3333333333334" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="632.3333333333334" dy="0">Deferred</tspan></text><text x="632.3333333333334" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="632.3333333333334" dy="0">Record the reason and</tspan><tspan x="632.3333333333334" dy="25">next decision time; do not</tspan><tspan x="632.3333333333334" dy="25">create automatic debt.</tspan></text></svg>
