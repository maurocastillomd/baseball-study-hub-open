<svg xmlns="http://www.w3.org/2000/svg" width="900" height="277" viewBox="0 0 900 277" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Moving down while slowing down</title><desc id="graphic-description">Moving down while slowing down. Upward is positive. This is a conceptual CMJ phase distinction, not an event-detection prescription.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="262.6666666666667" height="229" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Unweighting</tspan><tspan x="43.0" dy="29">example</tspan></text><text x="43.0" y="172" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Downward motion speeds</tspan><tspan x="43.0" dy="25">up: velocity negative,</tspan><tspan x="43.0" dy="25">acceleration negative</tspan></text><rect x="318.6666666666667" y="24" width="262.6666666666667" height="229" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="336.6666666666667" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="353.6666666666667" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="353.6666666666667" dy="0">2</tspan></text><text x="337.6666666666667" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="337.6666666666667" dy="0">Braking example</tspan></text><text x="337.6666666666667" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="337.6666666666667" dy="0">Downward motion slows:</tspan><tspan x="337.6666666666667" dy="25">velocity negative,</tspan><tspan x="337.6666666666667" dy="25">acceleration positive</tspan></text><rect x="613.3333333333334" y="24" width="262.6666666666667" height="229" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="631.3333333333334" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="648.3333333333334" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="648.3333333333334" dy="0">3</tspan></text><text x="632.3333333333334" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="632.3333333333334" dy="0">Upward transition</tspan></text><text x="632.3333333333334" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="632.3333333333334" dy="0">Velocity passes through</tspan><tspan x="632.3333333333334" dy="25">zero at the lowest position</tspan></text></svg>
