<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">The evidence ladder for a model claim</title><desc id="graphic-description">The evidence ladder for a model claim. Definition: What does the model mean here?; Intervention: What work was actually delivered?; Outcome: What changed, in whom, under which method?; Transfer: Does that answer this baseball decision?</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="410.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Definition</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">What does the model mean here?</tspan></text><rect x="466.0" y="24" width="410.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="484.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="501.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="501.0" dy="0">2</tspan></text><text x="485.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="485.0" dy="0">Intervention</tspan></text><text x="485.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="485.0" dy="0">What work was actually delivered?</tspan></text><rect x="466.0" y="231" width="410.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="484.0" y="247" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="501.0" y="266" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="501.0" dy="0">3</tspan></text><text x="485.0" y="305" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="485.0" dy="0">Outcome</tspan></text><text x="485.0" y="350" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="485.0" dy="0">What changed, in whom, under which</tspan><tspan x="485.0" dy="25">method?</tspan></text><rect x="24.0" y="231" width="410.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="247" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="266" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">4</tspan></text><text x="43.0" y="305" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Transfer</tspan></text><text x="43.0" y="350" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Does that answer this baseball decision?</tspan></text><path d="M437.0 111.5 L461.0 111.5" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="461.00,111.50 452.32,116.47 452.32,106.53" fill="#286149"/><path d="M671.0 203 L671.0 226" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="671.00,226.00 666.03,217.32 675.97,217.32" fill="#286149"/><path d="M463.0 318.5 L439.0 318.5" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="439.00,318.50 447.68,313.53 447.68,