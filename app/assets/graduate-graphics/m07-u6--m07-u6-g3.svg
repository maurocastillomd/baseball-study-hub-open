<svg xmlns="http://www.w3.org/2000/svg" width="900" height="223" viewBox="0 0 900 223" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Two readings bring two error terms</title><desc id="graphic-description">Two readings bring two error terms. Equal independent normal-error approximation. SEM1 cm gives MDC95 ≈ 2.77 cm.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="262.6666666666667" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">One reading</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">SEM = 1 cm</tspan></text><rect x="318.6666666666667" y="24" width="262.6666666666667" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="336.6666666666667" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="353.6666666666667" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="353.6666666666667" dy="0">2</tspan></text><text x="337.6666666666667" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="337.6666666666667" dy="0">Difference</tspan></text><text x="337.6666666666667" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="337.6666666666667" dy="0">SD error = √2 × 1 = 1.414</tspan><tspan x="337.6666666666667" dy="25">cm</tspan></text><rect x="613.3333333333334" y="24" width="262.6666666666667" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="631.3333333333334" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="648.3333333333334" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="648.3333333333334" dy="0">3</tspan></text><text x="632.3333333333334" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="632.3333333333334" dy="0">95% margin</tspan></text><text x="632.3333333333334" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="632.3333333333334" dy="0">1.96 × 1.414 = 2.77 cm</tspan></text><path d="M289.6666666666667 111.5 L313.6666666666667 111.5" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="313.67,111.50 304.99,116.47 304.99,106.53" fill="#286149"/><path d="M584.3333333333334 111.5 L608.3333333333334 111.5" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="608.33,111.50 599.66,116.47 599.66,106.53" fill="#286149"/></svg>
