<svg xmlns="http://www.w3.org/2000/svg" width="400" height="637" viewBox="0 0 400 637" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Match the tool to its direct observation</title><desc id="graphic-description">Match the tool to its direct observation. Derived values need an explicit model. This map does not validate any commercial device.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Force plate</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Force signal; other outcomes need</tspan><tspan x="43.0" dy="25">processing</tspan></text><rect x="24.0" y="231" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="247" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="266" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="305" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Dynamometer</tspan></text><text x="43.0" y="350" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Force at specified contact and setup</tspan></text><rect x="24.0" y="438" width="352.0" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="454" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="473" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="512" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Timing gates</tspan></text><text x="43.0" y="557" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Interval between defined trigger</tspan><tspan x="43.0" dy="25">events</tspan></text></svg>
