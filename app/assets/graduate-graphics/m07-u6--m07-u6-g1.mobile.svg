<svg xmlns="http://www.w3.org/2000/svg" width="400" height="448" viewBox="0 0 400 448" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Same noise, different relative reliability</title><desc id="graphic-description">Same noise, different relative reliability. Synthetic variance ratios:100/(100+4) = 0.962 versus 4/(4+4) = 0.50. Error variance remains 4 units².</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="184" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Wide athlete spread</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Between variance 100; error 4</tspan></text><text x="357.0" y="60" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">0.962</tspan></text><rect x="43.0" y="174" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="174" width="302.068" height="14" rx="5" fill="#286149" stroke="#286149"/><rect x="24.0" y="240" width="352.0" height="184" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="256" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="275" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="314" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" 