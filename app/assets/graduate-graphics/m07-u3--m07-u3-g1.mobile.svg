<svg xmlns="http://www.w3.org/2000/svg" width="400" height="562" viewBox="0 0 400 562" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">From support force to acceleration</title><desc id="graphic-description">From support force to acceleration. Synthetic 80 kg example; g = 9.81 m/s². Upward is positive. Values are instructional, not a test standard.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="150" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Measured force</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">1,200 N upward</tspan></text><rect x="24.0" y="206" width="352.0" height="150" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="222" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="241" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="280" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Subtract weight</tspan></text><text x="43.0" y="325" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">1,200 − 784.8 = 415.2 N net</tspan></text><rect x="24.0" y="388" width="352.0" height="150" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="404" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="423" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="462" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Divide by mass</tspan></text><text x="43.0" y="507" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">415.2/80 = 5.19 m/s²</tspan></text><path d="M200.0 178 L200.0 201" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,201.00 195.03,192.32 204.97,192.32" fill="#286149"/><path d="M200.0 360 L200.0 383" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,383.00 195.03,374.32 204.97,374.32" fill="#286149"/></svg>
