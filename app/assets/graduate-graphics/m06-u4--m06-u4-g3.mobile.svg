<svg xmlns="http://www.w3.org/2000/svg" width="400" height="712" viewBox="0 0 400 712" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Three options, three responsibilities</title><desc id="graphic-description">Three options, three responsibilities. Full: Deliver the named objective when the agreed window and scope fit.; Brief: Retain a specified task; name what is omitted.; Deferred: Record the reason and next decision time; do not create automatic debt.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="200" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Full</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Deliver the named objective when</tspan><tspan x="43.0" dy="25">the agreed window and scope fit.</tspan></text><rect x="24.0" y="256" width="352.0" height="200" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="272" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="291" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="330" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Brief</tspan></text><text x="43.0" y="375" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Retain a specified task; name what</tspan><tspan x="43.0" dy="25">is omitted.</tspan></text><rect x="24.0" y="488" width="352.0" height="200" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="504" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="523" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="562" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Deferred</tspan></text><text x="43.0" y="607" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Record the reason and next</tspan><tspan x="43.0" dy="25">decision time; do not create</tspan><tspan x="43.0" dy="25">automatic debt.</tspan></text></svg>
