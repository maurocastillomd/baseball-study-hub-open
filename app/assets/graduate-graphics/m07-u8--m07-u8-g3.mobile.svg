<svg xmlns="http://www.w3.org/2000/svg" width="400" height="739" viewBox="0 0 400 739" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Pilot quantities with different meanings</title><desc id="graphic-description">Pilot quantities with different meanings. Synthetic six-pair dataset; units are cm. Bias ≈ 0.667; TE ≈ 1.155; conventional difference margin ≈ 3.201. The pilot is too small to establish a local standard.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="209" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Mean bias</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Average retest−baseline difference</tspan></text><text x="357.0" y="60" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">0.667</tspan></text><rect x="43.0" y="199" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="199" width="65.4289284598563" height="14" rx="5" fill="#286149" stroke="#286149"/><rect x="24.0" y="265" width="352.0" height="209" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="281" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="300" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="339" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Typical error</tspan></text><text x="43.0" y="384" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Single-measurement random-error</tspan><tspan x="43.0" dy="25">model</tspan></text><text x="357.0" y="301" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">1.155</tspan></text><rect x="43.0" y="440" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="440" width="113.29896907216495" height="14" rx="5" fill="#286149" stroke="#286149"/><rect x="24.0" y="506" width="352.0" height="209" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="522" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="541" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="580" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">95% difference margin</tspan></text><text x="43.0" y="625" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">1.96 × √2 × TE, conditional on</tspan><tspan x="43.0" dy="25">assumptions</tspan></text><text x="357.0" y="542" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">3.201</tspan></text><rect x="43.0" y="681" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="681" width="314.0" height="14" rx="5" fill="#286149" stroke="#286149"/></svg>
