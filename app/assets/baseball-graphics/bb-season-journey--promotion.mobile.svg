<svg xmlns="http://www.w3.org/2000/svg" width="400" height="712" viewBox="0 0 400 712" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">The athlete arrives with a history</title><desc id="graphic-description">The athlete arrives with a history. Send: Last completed tasks, modifications, response and unknowns.. Confirm: Receiving staff reconcile role, medical status and today’s schedule.. Continue: Adapt familiar work; establish a comparable testing procedure.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="200" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Send</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Last completed tasks, modifications,</tspan><tspan x="43.0" dy="25">response and unknowns.</tspan></text><rect x="24.0" y="256" width="352.0" height="200" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="272" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="291" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="330" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Confirm</tspan></text><text x="43.0" y="375" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Receiving staff reconcile role,</tspan><tspan x="43.0" dy="25">medical status and today’s</tspan><tspan x="43.0" dy="25">schedule.</tspan></text><rect x="24.0" y="488" width="352.0" height="200" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="504" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="523" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="562" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Continue</tspan></text><text x="43.0" y="607" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Adapt familiar work; establish a</tspan><tspan x="43.0" dy="25">comparable testing procedure.</tspan></text><path d="M200.0 228 L200.0 251" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,251.00 195.03,242.32 204.97,242.32" fill="#286149"/><path d="M200.0 460 L200.0 483" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,483.00 195.03,474.32 204.97,474.32" fill="#286149"/></svg>
