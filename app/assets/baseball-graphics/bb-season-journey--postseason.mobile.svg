<svg xmlns="http://www.w3.org/2000/svg" width="400" height="712" viewBox="0 0 400 712" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Evaluate three layers before the next plan</title><desc id="graphic-description">Delivery: 13 of 14 revised sessions, only 10 full exercise records. Adaptation remains a question: the same exercise changed from 800 to 840 kg volume-load; this does not establish maximal strength or baseball improvement. Transfer: assess actual baseball tasks and the limits of causal attribution.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="200" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Delivery</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">13 of 14 revised sessions; only 10</tspan><tspan x="43.0" dy="25">full exercise records.</tspan></text><rect x="24.0" y="256" width="352.0" height="200" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="272" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="291" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="330" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Adaptation?</tspan></text><text x="43.0" y="375" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">800 to 840 kg volume-load. More</tspan><tspan x="43.0" dy="25">work recorded; adaptation remains</tspan><tspan x="43.0" dy="25">to be assessed.</tspan></text><rect x="24.0" y="488" width="352.0" height="200" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="504" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="523" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="562" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Transfer</tspan></text><text x="43.0" y="607" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Review baseball tasks and role;</tspan><tspan x="43.0" dy="25">causal attribution remains uncertain.</tspan></text><path d="M200.0 228 L200.0 251" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,251.00 195.03,242.32 204.97,242.32" fill="#286149"/><path d="M200.0 460 L200.0 483" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,483.00 195.03,474.32 204.97,474.32" fill="#286149"/></svg>
