<svg xmlns="http://www.w3.org/2000/svg" width="400" height="739" viewBox="0 0 400 739" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Protect the priority inside the window</title><desc id="graphic-description">Protect the priority inside the window. Primary slot: 35 minutes confirmed; highest-priority familiar work.. Second slot: 25 minutes confirmed; complementary work.. Reserve slot: 20 minutes provisional; do not rely on it.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="209" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Primary slot</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">35 minutes confirmed;</tspan><tspan x="43.0" dy="25">highest-priority familiar work.</tspan></text><text x="357.0" y="60" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">35</tspan></text><rect x="43.0" y="199" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="199" width="314.0" height="14" rx="5" fill="#286149" stroke="#286149"/><rect x="24.0" y="265" width="352.0" height="209" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="281" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="300" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="339" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Second slot</tspan></text><text x="43.0" y="384" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">25 minutes confirmed;</tspan><tspan x="43.0" dy="25">complementary work.</tspan></text><text x="357.0" y="301" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">25</tspan></text><rect x="43.0" y="440" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="440" width="224.28571428571428" height="14" rx="5" fill="#286149" stroke="#286149"/><rect x="24.0" y="506" width="352.0" height="209" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="522" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="541" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="580" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Reserve slot</tspan></text><text x="43.0" y="625" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">20 minutes provisional; do not rely</tspan><tspan x="43.0" dy="25">on it.</tspan></text><text x="357.0" y="542" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="end"><tspan x="357.0" dy="0">20</tspan></text><rect x="43.0" y="681" width="314.0" height="14" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="43.0" y="681" width="179.42857142857142" height="14" rx="5" fill="#286149" stroke="#286149"/></svg>
