<svg xmlns="http://www.w3.org/2000/svg" width="900" height="273" viewBox="0 0 900 273" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Evaluate three layers before the next plan</title><desc id="graphic-description">Delivery: 13 of 14 revised sessions, only 10 full exercise records. Adaptation remains a question: the same exercise changed from 800 to 840 kg volume-load; this does not establish maximal strength or baseball improvement. Transfer: assess actual baseball tasks and the limits of causal attribution.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="262.6666666666667" height="225" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Delivery</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">13 of 14 revised</tspan><tspan x="43.0" dy="25">sessions; only 10 full</tspan><tspan x="43.0" dy="25">exercise records.</tspan></text><rect x="318.6666666666667" y="24" width="262.6666666666667" height="225" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="336.6666666666667" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="353.6666666666667" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="353.6666666666667" dy="0">2</tspan></text><text x="337.6666666666667" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="337.6666666666667" dy="0">Adaptation?</tspan></text><text x="337.6666666666667" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="337.6666666666667" dy="0">800 to 840 kg</tspan><tspan x="337.6666666666667" dy="25">volume-load. More work</tspan><tspan x="337.6666666666667" dy="25">recorded; adaptation</tspan><tspan x="337.6666666666667" dy="25">remains to be assessed.</tspan></text><rect x="613.3333333333334" y="24" width="262.6666666666667" height="225" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="631.3333333333334" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="648.3333333333334" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="648.3333333333334" dy="0">3</tspan></text><text x="632.3333333333334" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="632.3333333333334" dy="0">Transfer</tspan></text><text x="632.3333333333334" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="632.3333333333334" dy="0">Review baseball tasks</tspan><tspan x="632.3333333333334" dy="25">and role; causal</tspan><tspan x="632.3333333333334" dy="25">attribution remains</tspan><tspan x="632.3333333333334" dy="25">uncertain.</tspan></text><path d="M289.6666666666667 136.5 L313.6666666666667 136.5" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="313.67,136.50 304.99,141.47 304.99,131.53" fill="#286149"/><path d="M584.3333333333334 136.5 L608.3333333333334 136.5" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="608.33,136.50 599.66,141.47 599.66,131.53" fill="#286149"/></svg>
