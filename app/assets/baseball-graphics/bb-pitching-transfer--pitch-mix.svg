<svg xmlns="http://www.w3.org/2000/svg" width="900" height="223" viewBox="0 0 900 223" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Why the pooled average rose</title><desc id="graphic-description">Why the pooled average rose: Session A: Two-thirds four-seam; pooled 89.33 mph. Session B: Five-sixths four-seam; pooled 89.67 mph. Within each type: Both means are 1 mph lower</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="262.6666666666667" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="59.0" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Session A</tspan></text><text x="43.0" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Two-thirds four-seam;</tspan><tspan x="43.0" dy="25">pooled 89.33 mph</tspan></text><rect x="318.6666666666667" y="24" width="262.6666666666667" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="336.6666666666667" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="353.6666666666667" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="353.6666666666667" dy="0">2</tspan></text><text x="337.6666666666667" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="337.6666666666667" dy="0">Session B</tspan></text><text x="337.6666666666667" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="337.6666666666667" dy="0">Five-sixths four-seam;</tspan><tspan x="337.6666666666667" dy="25">pooled 89.67 mph</tspan></text><rect x="613.3333333333334" y="24" width="262.6666666666667" height="175" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="631.3333333333334" y="40" width="34" height="26" rx="6" fill="#286149" stroke="#286149"/><text x="648.3333333333334" y="59" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="648.3333333333334" dy="0">3</tspan></text><text x="632.3333333333334" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start"><tspan x="632.3333333333334" dy="0">Within each type</tspan></text><text x="632.3333333333334" y="143" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start"><tspan x="632.3333333333334" dy="0">Both means are 1 mph</tspan><tspan x="632.3333333333334" dy="25">lower</tspan></text></svg>
