<svg xmlns="http://www.w3.org/2000/svg" width="900" height="307" viewBox="0 0 900 307" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Running and strength rebuild different capacities</title><desc id="graphic-description">The running lane rebuilds velocity and task coordination; the strength lane targets force and specific positions. Their doses meet in one athlete’s schedule.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="414.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24.0" y="24" width="414.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">01</tspan></text><text x="45.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">Running lane</tspan></text><circle cx="48.0" cy="139" r="3" fill="#286149"/><text x="60.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Speed and task coordination</tspan></text><circle cx="48.0" cy="188" r="3" fill="#286149"/><text x="60.0" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Acceleration and repetitions</tspan></text><circle cx="48.0" cy="237" r="3" fill="#286149"/><text x="60.0" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Observed field response</tspan></text><rect x="462.0" y="24" width="414.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="462.0" y="24" width="414.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="483.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="483.0" dy="0">02</tspan></text><text x="483.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="483.0" dy="0">Strength lane</tspan></text><circle cx="486.0" cy="139" r="3" fill="#286149"/><text x="498.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="498.0" dy="0">Knee-flexor loading</tspan></text><circle cx="486.0" cy="188" r="3" fill="#286149"/><text x="498.0" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="498.0" dy="0">Hip-extension loading</tspan></text><circle cx="486.0" cy="237" r="3" fill="#286149"/><text x="498.0" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="498.0" dy="0">Range, force, and exercise response</tspan></text></svg>
