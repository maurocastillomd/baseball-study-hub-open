<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Remember the UCL by its connections</title><desc id="graphic-description">The anterior bundle spans the medial humeral region toward the coronoid; the posterior spans toward the olecranon; the transverse connects parts of the ulna.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="268.0" height="262" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">01</tspan></text><text x="45.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">Anterior</tspan></text><circle cx="48.0" cy="139" r="3" fill="#286149"/><text x="60.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Medial humeral region</tspan></text><circle cx="48.0" cy="188" r="3" fill="#286149"/><text x="60.0" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Toward proximal</tspan><tspan x="60.0" dy="26">coronoid</tspan></text><rect x="316.0" y="24" width="268.0" height="262" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="316.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="337.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">02</tspan></text><text x="337.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">Posterior</tspan></text><circle cx="340.0" cy="139" r="3" fill="#286149"/><text x="352.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Medial humeral region</tspan></text><circle cx="340.0" cy="188" r="3" fill="#286149"/><text x="352.0" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Toward medial</tspan><tspan x="352.0" dy="26">olecranon</tspan></text><rect x="608.0" y="24" width="268.0" height="262" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="608.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="629.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">03</tspan></text><text x="629.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">Transverse</tspan></text><circle cx="632.0" cy="139" r="3" fill="#286149"/><text x="644.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Connects regions of the</tspan><tspan x="644.0" dy="26">ulna</tspan></text><circle cx="632.0" cy="214" r="3" fill="#286149"/><text x="644.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Not the same spanning</tspan><tspan x="644.0" dy="26">pattern</tspan></text></svg>
