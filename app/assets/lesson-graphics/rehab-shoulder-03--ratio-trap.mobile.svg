<svg xmlns="http://www.w3.org/2000/svg" width="400" height="752" viewBox="0 0 400 752" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">A better ratio can hide unchanged force</title><desc id="graphic-description">Fictional values change from 90 versus 100 to 90 versus 90. Symmetry rises from 90 to 100 percent while involved-arm force stays at 90.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="210" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">First test</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Involved 90; other 100</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Symmetry = 90%</tspan></text><rect x="24" y="258" width="352.0" height="210" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="258" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="289" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="320" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Second test</tspan></text><circle cx="48" cy="373" r="3" fill="#286149"/><text x="60" y="379" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Involved 90; other 90</tspan></text><circle cx="48" cy="422" r="3" fill="#286149"/><text x="60" y="428" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Symmetry = 100%</tspan></text><rect x="24" y="492" width="352.0" height="236" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="492" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="523" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">03</tspan></text><text x="45" y="554" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Meaning</tspan></text><circle cx="48" cy="607" r="3" fill="#286149"/><text x="60" y="613" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Involved output is unchanged</tspan></text><circle cx="48" cy="656" r="3" fill="#286149"/><text x="60" y="662" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Check both limbs and the</tspan><tspan x="60" dy="26">method</tspan></text></svg>
