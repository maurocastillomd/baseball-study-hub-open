<svg xmlns="http://www.w3.org/2000/svg" width="400" height="804" viewBox="0 0 400 804" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">An isolated angle can hide the whole arc</title><desc id="graphic-description">Fictional throwing-arm rotation is 45 degrees internal plus 115 external; the other arm is 60 plus 100. Both total 160, but symptoms and method still matter.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="236" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Throwing arm</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">IR 45° + ER 115° = 160°</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Less IR; more ER in this</tspan><tspan x="60" dy="26">example</tspan></text><rect x="24" y="284" width="352.0" height="210" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="284" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="315" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="346" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Other arm</tspan></text><circle cx="48" cy="399" r="3" fill="#286149"/><text x="60" y="405" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">IR 60° + ER 100° = 160°</tspan></text><circle cx="48" cy="448" r="3" fill="#286149"/><text x="60" y="454" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Same total; different distribution</tspan></text><rect x="24" y="518" width="352.0" height="262" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="518" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="549" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">03</tspan></text><text x="45" y="580" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Interpretation</tspan></text><circle cx="48" cy="633" r="3" fill="#286149"/><text x="60" y="639" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Check symptoms and test</tspan><tspan x="60" dy="26">method</tspan></text><circle cx="48" cy="708" r="3" fill="#286149"/><text x="60" y="714" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Equal totals do not establish</tspan><tspan x="60" dy="26">health</tspan></text></svg>
