<svg xmlns="http://www.w3.org/2000/svg" width="400" height="590" viewBox="0 0 400 590" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Can do versus recently did</title><desc id="graphic-description">Capacity tests describe demonstrated performance, while exposure records describe recent work; neither replaces the other.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Capacity: can do</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Comparable test performance</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Specific method and conditions</tspan></text><circle cx="48" cy="237" r="3" fill="#286149"/><text x="60" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Current physical profile</tspan></text><rect x="24" y="307" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="307" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="338" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="369" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Exposure: recently did</tspan></text><circle cx="48" cy="422" r="3" fill="#286149"/><text x="60" y="428" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Actual baseball and gym work</tspan></text><circle cx="48" cy="471" r="3" fill="#286149"/><text x="60" y="477" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Known, estimated or missing</tspan></text><circle cx="48" cy="520" r="3" fill="#286149"/><text x="60" y="526" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Recent task preparation</tspan></text></svg>
