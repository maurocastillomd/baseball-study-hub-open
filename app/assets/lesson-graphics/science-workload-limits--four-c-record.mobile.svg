<svg xmlns="http://www.w3.org/2000/svg" width="400" height="878" viewBox="0 0 400 878" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Four questions before a workload conclusion</title><desc id="graphic-description">Name the count, add context, show completeness and identify a proportionate consequence.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Count</tspan></text><text x="43.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">What event or response was</tspan><tspan x="43.0" dy="26">measured?</tspan></text><rect x="24.0" y="242" width="352.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="259" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="278" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="316" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Context</tspan></text><text x="43.0" y="360" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">What task ingredients and</tspan><tspan x="43.0" dy="26">response matter?</tspan></text><rect x="24.0" y="460" width="352.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="477" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="496" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="534" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Completeness</tspan></text><text x="43.0" y="578" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Which categories or days are</tspan><tspan x="43.0" dy="26">unknown?</tspan></text><rect x="24.0" y="678" width="352.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="695" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="714" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">4</tspan></text><text x="43.0" y="752" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Consequence</tspan></text><text x="43.0" y="796" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">What decision can this record</tspan><tspan x="43.0" dy="26">support?</tspan></text><path d="M200.0 206 L200.0 234" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,234.00 195.03,225.32 204.97,225.32" fill="#286149"/><path d="M200.0 424 L200.0 452" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,452.00 195.03,443.32 204.97,443.32" fill="#286149"/><path d="M200.0 642 L200.0 670" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,670.00 195.03,661.32 204.97,661.32" fill="#286149"/></svg>
