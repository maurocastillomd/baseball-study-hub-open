<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">One roster, three different questions</title><desc id="graphic-description">An everyday player, reserve and catcher may need different emphasis because game use does not capture their full work.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">01</tspan></text><text x="45.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">Everyday player</tspan></text><circle cx="48.0" cy="139" r="3" fill="#286149"/><text x="60.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Review accumulated</tspan><tspan x="60.0" dy="26">work</tspan></text><circle cx="48.0" cy="214" r="3" fill="#286149"/><text x="60.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Preserve useful familiar</tspan><tspan x="60.0" dy="26">training</tspan></text><circle cx="48.0" cy="289" r="3" fill="#286149"/><text x="60.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Fit the competition</tspan><tspan x="60.0" dy="26">window</tspan></text><rect x="316.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="316.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="337.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">02</tspan></text><text x="337.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">Reserve outfielder</tspan></text><circle cx="340.0" cy="139" r="3" fill="#286149"/><text x="352.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Verify running exposure</tspan></text><circle cx="340.0" cy="188" r="3" fill="#286149"/><text x="352.0" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Prepare for the</tspan><tspan x="352.0" dy="26">possible role</tspan></text><circle cx="340.0" cy="263" r="3" fill="#286149"/><text x="352.0" y="269" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Choose a specific</tspan><tspan x="352.0" dy="26">supplement</tspan></text><rect x="608.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="608.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="629.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">03</tspan></text><text x="629.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">Backup catcher</tspan></text><circle cx="632.0" cy="139" r="3" fill="#286149"/><text x="644.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Count bullpens and</tspan><tspan x="644.0" dy="26">practice</tspan></text><circle cx="632.0" cy="214" r="3" fill="#286149"/><text x="644.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Review the whole day</tspan></text><circle cx="632.0" cy="263" r="3" fill="#286149"/><text x="644.0" y="269" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Individualize the gym</tspan><tspan x="644.0" dy="26">dose</tspan></text></svg>
