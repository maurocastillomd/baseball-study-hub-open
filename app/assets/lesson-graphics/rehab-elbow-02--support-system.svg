<svg xmlns="http://www.w3.org/2000/svg" width="900" height="415" viewBox="0 0 900 415" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Three contributions to the throwing task</title><desc id="graphic-description">The UCL contributes passive restraint, flexor-pronator muscles contribute dynamic support, and the shoulder, trunk and lower body contribute to whole-body preparation. These contributions complement one another; training does not replace an injured ligament.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="268.0" height="367" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">01</tspan></text><text x="45.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">Ligament restraint</tspan></text><circle cx="48.0" cy="139" r="3" fill="#286149"/><text x="60.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Connects humerus and</tspan><tspan x="60.0" dy="26">ulna</tspan></text><circle cx="48.0" cy="214" r="3" fill="#286149"/><text x="60.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Resists valgus demand</tspan></text><circle cx="48.0" cy="263" r="3" fill="#286149"/><text x="60.0" y="269" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Tissue and treatment</tspan><tspan x="60.0" dy="26">matter</tspan></text><rect x="316.0" y="24" width="268.0" height="367" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="316.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="337.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">02</tspan></text><text x="337.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">Muscular support</tspan></text><circle cx="340.0" cy="139" r="3" fill="#286149"/><text x="352.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Flexor-pronator</tspan><tspan x="352.0" dy="26">contribution</tspan></text><circle cx="340.0" cy="214" r="3" fill="#286149"/><text x="352.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Capacity and task differ</tspan></text><circle cx="340.0" cy="263" r="3" fill="#286149"/><text x="352.0" y="269" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Strength is one input</tspan></text><rect x="608.0" y="24" width="268.0" height="367" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="608.0" y="24" width="268.0" height="122" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="629.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">03</tspan></text><text x="629.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">Whole-body</tspan><tspan x="629.0" dy="30">preparation</tspan></text><circle cx="632.0" cy="169" r="3" fill="#286149"/><text x="644.0" y="175" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Shoulder, trunk and</tspan><tspan x="644.0" dy="26">legs</tspan></text><circle cx="632.0" cy="244" r="3" fill="#286149"/><text x="644.0" y="250" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Coordinate gym and</tspan><tspan x="644.0" dy="26">field</tspan></text><circle cx="632.0" cy="319" r="3" fill="#286149"/><text x="644.0" y="325" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Preserve the baseball</tspan><tspan x="644.0" dy="26">task</tspan></text></svg>
