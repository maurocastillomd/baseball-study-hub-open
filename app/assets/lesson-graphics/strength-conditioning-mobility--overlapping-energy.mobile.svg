<svg xmlns="http://www.w3.org/2000/svg" width="400" height="899" viewBox="0 0 400 899" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Three ATP contributors, one changing task</title><desc id="graphic-description">Phosphagen contribution supports rapid ATP resynthesis; glycolysis uses carbohydrate; oxidative pathways support sustained work and recovery. All overlap.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Phosphagen</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Rapid ATP replenishment</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Limited immediate reserve</tspan></text><circle cx="48" cy="237" r="3" fill="#286149"/><text x="60" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Important in brief intense work</tspan></text><rect x="24" y="307" width="352.0" height="285" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="307" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="338" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="369" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Glycolytic</tspan></text><circle cx="48" cy="422" r="3" fill="#286149"/><text x="60" y="428" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Breaks down carbohydrate</tspan></text><circle cx="48" cy="471" r="3" fill="#286149"/><text x="60" y="477" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Supports demanding repeated</tspan><tspan x="60" dy="26">work</tspan></text><circle cx="48" cy="546" r="3" fill="#286149"/><text x="60" y="552" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Not the same as fat oxidation</tspan></text><rect x="24" y="616" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="616" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="647" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">03</tspan></text><text x="45" y="678" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Oxidative</tspan></text><circle cx="48" cy="731" r="3" fill="#286149"/><text x="60" y="737" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Supports sustained ATP supply</tspan></text><circle cx="48" cy="780" r="3" fill="#286149"/><text x="60" y="786" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Contributes during recovery</tspan></text><circle cx="48" cy="829" r="3" fill="#286149"/><text x="60" y="835" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Works alongside other pathways</tspan></text></svg>
