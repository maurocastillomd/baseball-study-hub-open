<svg xmlns="http://www.w3.org/2000/svg" width="900" height="389" viewBox="0 0 900 389" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Four questions need different evidence</title><desc id="graphic-description">Description states what happened, association describes co-variation, while prediction and causation need additional design and evaluation.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="268.0" height="341" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24.0" y="24" width="268.0" height="122" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">01</tspan></text><text x="45.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">Describe and</tspan><tspan x="45.0" dy="30">associate</tspan></text><circle cx="48.0" cy="169" r="3" fill="#286149"/><text x="60.0" y="175" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">What was measured?</tspan></text><circle cx="48.0" cy="218" r="3" fill="#286149"/><text x="60.0" y="224" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">How do variables vary</tspan><tspan x="60.0" dy="26">together?</tspan></text><circle cx="48.0" cy="293" r="3" fill="#286149"/><text x="60.0" y="299" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Check units, sample</tspan><tspan x="60.0" dy="26">and plot</tspan></text><rect x="316.0" y="24" width="268.0" height="341" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="316.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="337.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">02</tspan></text><text x="337.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">Predict</tspan></text><circle cx="340.0" cy="139" r="3" fill="#286149"/><text x="352.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">How well on new</tspan><tspan x="352.0" dy="26">observations?</tspan></text><circle cx="340.0" cy="214" r="3" fill="#286149"/><text x="352.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Evaluate out-of-sample</tspan><tspan x="352.0" dy="26">error</tspan></text><circle cx="340.0" cy="289" r="3" fill="#286149"/><text x="352.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Match design to</tspan><tspan x="352.0" dy="26">intended use</tspan></text><rect x="608.0" y="24" width="268.0" height="341" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="608.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="629.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">03</tspan></text><text x="629.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">Explain causally</tspan></text><circle cx="632.0" cy="139" r="3" fill="#286149"/><text x="644.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">What would happen</tspan><tspan x="644.0" dy="26">otherwise?</tspan></text><circle cx="632.0" cy="214" r="3" fill="#286149"/><text x="644.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Address confounding</tspan><tspan x="644.0" dy="26">and selection</tspan></text><circle cx="632.0" cy="289" r="3" fill="#286149"/><text x="644.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Do not infer from</tspan><tspan x="644.0" dy="26">correlation alone</tspan></text></svg>
