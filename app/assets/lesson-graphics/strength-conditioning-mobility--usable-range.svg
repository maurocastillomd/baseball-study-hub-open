<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Turn available range into usable movement</title><desc id="graphic-description">Identify the needed position, assess available range, develop control and test its use in the baseball task. Symptoms require appropriate evaluation.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="405.0" height="150" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Name the position</tspan></text><text x="43.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">What does the baseball task require?</tspan></text><rect x="471.0" y="24" width="405.0" height="150" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="489.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="506.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="506.0" dy="0">2</tspan></text><text x="490.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="490.0" dy="0">Reach</tspan></text><text x="490.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="490.0" dy="0">Measure range with a stable method.</tspan></text><rect x="471.0" y="216" width="405.0" height="150" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="489.0" y="233" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="506.0" y="252" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="506.0" dy="0">3</tspan></text><text x="490.0" y="290" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="490.0" dy="0">Control</tspan></text><text x="490.0" y="334" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="490.0" dy="0">Practice force and coordination in range.</tspan></text><rect x="24.0" y="216" width="405.0" height="150" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="233" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="252" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">4</tspan></text><text x="43.0" y="290" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Use</tspan></text><text x="43.0" y="334" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Recheck the actual baseball movement.</tspan></text><path d="M434.0 99.0 L463.0 99.0" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="463.00,99.00 454.32,103.97 454.32,94.03" fill="#286149"/><path d="M673.5 180 L673.5 208" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="673.50,208.00 668.53,199.32 678.47,199.32" fill="#286149"/><path d="M466.0 291.0 L437.0 291.0" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="437.00,291.00 445.68,286.03 445.68,295.97" fill="#286149"/></svg>
