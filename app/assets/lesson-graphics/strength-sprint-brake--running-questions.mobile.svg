<svg xmlns="http://www.w3.org/2000/svg" width="400" height="694" viewBox="0 0 400 694" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Four running questions, different tasks</title><desc id="graphic-description">Acceleration concerns first steps; higher-speed running concerns later fast motion; braking concerns momentum removal; reactivity adds a decision.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="285" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">GO and FAST</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">GO: consistent short start</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">FAST: enough space to run fast</tspan></text><circle cx="48" cy="237" r="3" fill="#286149"/><text x="60" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Runout protects the measured</tspan><tspan x="60" dy="26">segment</tspan></text><rect x="24" y="333" width="352.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="333" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="364" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="395" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">STOP and READ</tspan></text><circle cx="48" cy="448" r="3" fill="#286149"/><text x="60" y="454" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">STOP: planned momentum</tspan><tspan x="60" dy="26">removal</tspan></text><circle cx="48" cy="523" r="3" fill="#286149"/><text x="60" y="529" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">READ: respond to useful</tspan><tspan x="60" dy="26">information</tspan></text><circle cx="48" cy="598" r="3" fill="#286149"/><text x="60" y="604" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Score the decision and</tspan><tspan x="60" dy="26">movement</tspan></text></svg>
