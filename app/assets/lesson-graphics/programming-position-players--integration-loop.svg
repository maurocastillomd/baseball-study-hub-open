<svg xmlns="http://www.w3.org/2000/svg" width="900" height="684" viewBox="0 0 900 684" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Coordinate, deliver, review</title><desc id="graphic-description">Plan from role and exposure, integrate the day, record completion and response, then revise the individual emphasis.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="405.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Role and evidence</tspan></text><text x="43.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Name the player’s immediate job and</tspan><tspan x="43.0" dy="26">history.</tspan></text><rect x="471.0" y="24" width="405.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="489.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="506.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="506.0" dy="0">2</tspan></text><text x="490.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="490.0" dy="0">Integrated plan</tspan></text><text x="490.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="490.0" dy="0">Coordinate field, gym and conditioning.</tspan></text><rect x="471.0" y="242" width="405.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="489.0" y="259" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="506.0" y="278" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="506.0" dy="0">3</tspan></text><text x="490.0" y="316" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="490.0" dy="0">Delivery</tspan></text><text x="490.0" y="360" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="490.0" dy="0">Record actual dose and modifications.</tspan></text><rect x="24.0" y="242" width="405.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="259" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="278" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">4</tspan></text><text x="43.0" y="316" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Response</tspan></text><text x="43.0" y="360" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Review comparable measures and</tspan><tspan x="43.0" dy="26">athlete report.</tspan></text><rect x="24.0" y="460" width="405.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="477" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="496" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">5</tspan></text><text x="43.0" y="534" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Revision</tspan></text><text x="43.0" y="578" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Keep or change a specific emphasis.</tspan></text><path d="M434.0 112.0 L463.0 112.0" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="463.00,112.00 454.32,116.97 454.32,107.03" fill="#286149"/><path d="M673.5 206 L673.5 234" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="673.50,234.00 668.53,225.32 678.47,225.32" fill="#286149"/><path d="M466.0 330.0 L437.0 330.0" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="437.00,330.00 445.68,325.03 445.68,334.97" fill="#286149"/><path d="M226.5 424 L226.5 452" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="226.50,452.00 221.53,443.32 231.47,443.32" fill="#286149"/><path d="M24.0 548.0 H10 V112.0 H16.0" fill="none" stroke="#286149" stroke-width="2" stroke-dasharray="6 5"/><path d="M8.0 112.0 L17.0 112.0" stroke="#286149" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/><polygon points="17.00,112.00 8.32,116.97 8.32,107.03" fill="#286149"/></svg>
