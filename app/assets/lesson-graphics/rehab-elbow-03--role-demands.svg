<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">The role changes what repeatable means</title><desc id="graphic-description">A starter, reliever and position player require different combinations of workload, availability and baseball skills. A generic ready-for-baseball label omits those differences.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">01</tspan></text><text x="45.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">Starter</tspan></text><circle cx="48.0" cy="139" r="3" fill="#286149"/><text x="60.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Repeated work across</tspan><tspan x="60.0" dy="26">innings</tspan></text><circle cx="48.0" cy="214" r="3" fill="#286149"/><text x="60.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Planned rotation</tspan><tspan x="60.0" dy="26">context</tspan></text><circle cx="48.0" cy="289" r="3" fill="#286149"/><text x="60.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Quality and recovery</tspan><tspan x="60.0" dy="26">over the role</tspan></text><rect x="316.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="316.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="337.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">02</tspan></text><text x="337.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">Reliever</tspan></text><circle cx="340.0" cy="139" r="3" fill="#286149"/><text x="352.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Availability can be less</tspan><tspan x="352.0" dy="26">predictable</tspan></text><circle cx="340.0" cy="214" r="3" fill="#286149"/><text x="352.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Role and warm-up</tspan><tspan x="352.0" dy="26">demands matter</tspan></text><circle cx="340.0" cy="289" r="3" fill="#286149"/><text x="352.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">One outing is a limited</tspan><tspan x="352.0" dy="26">observation</tspan></text><rect x="608.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="608.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="629.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">03</tspan></text><text x="629.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">Position player</tspan></text><circle cx="632.0" cy="139" r="3" fill="#286149"/><text x="644.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Throwing plus fielding</tspan><tspan x="644.0" dy="26">and batting</tspan></text><circle cx="632.0" cy="214" r="3" fill="#286149"/><text x="644.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Transfers and decisions</tspan><tspan x="644.0" dy="26">add context</tspan></text><circle cx="632.0" cy="289" r="3" fill="#286149"/><text x="644.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Catcher demands need</tspan><tspan x="644.0" dy="26">specific review</tspan></text></svg>
