<svg xmlns="http://www.w3.org/2000/svg" width="900" height="367" viewBox="0 0 900 367" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Faster approach: more momentum to remove</title><desc id="graphic-description">For a fictional 90 kg runner, momentum is 360 at 4 m/s, 540 at 6 m/s and 720 at 8 m/s in kilogram-meters per second.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><text x="30" y="30" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="30" dy="0">kg·m/s</tspan></text><text x="30" y="64" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="30" dy="0">0</tspan></text><text x="800" y="64" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">720</tspan></text><text x="30" y="91" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="30" dy="0">4 m/s</tspan></text><rect x="30" y="106" width="770" height="22" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="30" y="106" width="385.0" height="22" rx="5" fill="#286149" stroke="#286149"/><text x="814" y="125" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="814" dy="0">360</tspan></text><text x="30" y="171" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="30" dy="0">6 m/s</tspan></text><rect x="30" y="186" width="770" height="22" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="30" y="186" width="577.5" height="22" rx="5" fill="#286149" stroke="#286149"/><text x="814" y="205" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="814" dy="0">540</tspan></text><text x="30" y="251" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="30" dy="0">8 m/s</tspan></text><rect x="30" y="266" width="770" height="22" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="30" y="266" width="770.0" height="22" rx="5" fill="#286149" stroke="#286149"/><text x="814" y="285" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="814" dy="0">720</tspan></text></svg>
