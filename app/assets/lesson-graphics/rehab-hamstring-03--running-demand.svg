<svg xmlns="http://www.w3.org/2000/svg" width="900" height="307" viewBox="0 0 900 307" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">A short start and a fast run answer different questions</title><desc id="graphic-description">A short start samples acceleration; a longer run can provide more high-speed exposure. Both need their own task and response record.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="414.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24.0" y="24" width="414.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">01</tspan></text><text x="45.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">Short acceleration</tspan></text><circle cx="48.0" cy="139" r="3" fill="#286149"/><text x="60.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Starts from low speed</tspan></text><circle cx="48.0" cy="188" r="3" fill="#286149"/><text x="60.0" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Emphasizes the build-up</tspan></text><circle cx="48.0" cy="237" r="3" fill="#286149"/><text x="60.0" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">May provide little peak-speed time</tspan></text><rect x="462.0" y="24" width="414.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="462.0" y="24" width="414.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="483.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="483.0" dy="0">02</tspan></text><text x="483.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="483.0" dy="0">Higher-speed exposure</tspan></text><circle cx="486.0" cy="139" r="3" fill="#286149"/><text x="498.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="498.0" dy="0">Needs an appropriate approach</tspan></text><circle cx="486.0" cy="188" r="3" fill="#286149"/><text x="498.0" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="498.0" dy="0">Samples faster running demand</tspan></text><circle cx="486.0" cy="237" r="3" fill="#286149"/><text x="498.0" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="498.0" dy="0">Needs space to slow down</tspan></text></svg>
