<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1029" viewBox="0 0 400 1029" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">The role changes what repeatable means</title><desc id="graphic-description">A starter, reliever and position player require different combinations of workload, availability and baseball skills. A generic ready-for-baseball label omits those differences.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="285" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Starter</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Repeated work across innings</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Planned rotation context</tspan></text><circle cx="48" cy="237" r="3" fill="#286149"/><text x="60" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Quality and recovery over the</tspan><tspan x="60" dy="26">role</tspan></text><rect x="24" y="333" width="352.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="333" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="364" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="395" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Reliever</tspan></text><circle cx="48" cy="448" r="3" fill="#286149"/><text x="60" y="454" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Availability can be less</tspan><tspan x="60" dy="26">predictable</tspan></text><circle cx="48" cy="523" r="3" fill="#286149"/><text x="60" y="529" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Role and warm-up demands</tspan><tspan x="60" dy="26">matter</tspan></text><circle cx="48" cy="598" r="3" fill="#286149"/><text x="60" y="604" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">One outing is a limited</tspan><tspan x="60" dy="26">observation</tspan></text><rect x="24" y="694" width="352.0" height="311" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="694" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="725" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">03</tspan></text><text x="45" y="756" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Position player</tspan></text><circle cx="48" cy="809" r="3" fill="#286149"/><text x="60" y="815" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Throwing plus fielding and batting</tspan></text><circle cx="48" cy="858" r="3" fill="#286149"/><text x="60" y="864" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Transfers and decisions add</tspan><tspan x="60" dy="26">context</tspan></text><circle cx="48" cy="933" r="3" fill="#286149"/><text x="60" y="939" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Catcher demands need specific</tspan><tspan x="60" dy="26">review</tspan></text></svg>
