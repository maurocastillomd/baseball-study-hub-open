<svg xmlns="http://www.w3.org/2000/svg" width="400" height="951" viewBox="0 0 400 951" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Same region, different information</title><desc id="graphic-description">Ligament contributes passive restraint; muscle contributes active support; nerve symptoms add a distinct clinical question. None can be diagnosed by grip alone.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="285" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Ligament</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Passive restraint</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Structure needs clinical</tspan><tspan x="60" dy="26">assessment</tspan></text><circle cx="48" cy="263" r="3" fill="#286149"/><text x="60" y="269" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Not a contracting muscle</tspan></text><rect x="24" y="333" width="352.0" height="285" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="333" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="364" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="395" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Muscle</tspan></text><circle cx="48" cy="448" r="3" fill="#286149"/><text x="60" y="454" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Dynamic support</tspan></text><circle cx="48" cy="497" r="3" fill="#286149"/><text x="60" y="503" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Capacity can be trained and</tspan><tspan x="60" dy="26">measured</tspan></text><circle cx="48" cy="572" r="3" fill="#286149"/><text x="60" y="578" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Strength does not certify healing</tspan></text><rect x="24" y="642" width="352.0" height="285" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="642" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="673" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">03</tspan></text><text x="45" y="704" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Nerve</tspan></text><circle cx="48" cy="757" r="3" fill="#286149"/><text x="60" y="763" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Sensory symptoms matter</tspan></text><circle cx="48" cy="806" r="3" fill="#286149"/><text x="60" y="812" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Report timing and distribution</tspan></text><circle cx="48" cy="855" r="3" fill="#286149"/><text x="60" y="861" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Do not dismiss with a good grip</tspan><tspan x="60" dy="26">score</tspan></text></svg>
