<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Three ATP contributors, one changing task</title><desc id="graphic-description">Phosphagen contribution supports rapid ATP resynthesis; glycolysis uses carbohydrate; oxidative pathways support sustained work and recovery. All overlap.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">01</tspan></text><text x="45.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">Phosphagen</tspan></text><circle cx="48.0" cy="139" r="3" fill="#286149"/><text x="60.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Rapid ATP</tspan><tspan x="60.0" dy="26">replenishment</tspan></text><circle cx="48.0" cy="214" r="3" fill="#286149"/><text x="60.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Limited immediate</tspan><tspan x="60.0" dy="26">reserve</tspan></text><circle cx="48.0" cy="289" r="3" fill="#286149"/><text x="60.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Important in brief</tspan><tspan x="60.0" dy="26">intense work</tspan></text><rect x="316.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="316.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="337.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">02</tspan></text><text x="337.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">Glycolytic</tspan></text><circle cx="340.0" cy="139" r="3" fill="#286149"/><text x="352.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Breaks down</tspan><tspan x="352.0" dy="26">carbohydrate</tspan></text><circle cx="340.0" cy="214" r="3" fill="#286149"/><text x="352.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Supports demanding</tspan><tspan x="352.0" dy="26">repeated work</tspan></text><circle cx="340.0" cy="289" r="3" fill="#286149"/><text x="352.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">Not the same as fat</tspan><tspan x="352.0" dy="26">oxidation</tspan></text><rect x="608.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="608.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="629.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">03</tspan></text><text x="629.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">Oxidative</tspan></text><circle cx="632.0" cy="139" r="3" fill="#286149"/><text x="644.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Supports sustained</tspan><tspan x="644.0" dy="26">ATP supply</tspan></text><circle cx="632.0" cy="214" r="3" fill="#286149"/><text x="644.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Contributes during</tspan><tspan x="644.0" dy="26">recovery</tspan></text><circle cx="632.0" cy="289" r="3" fill="#286149"/><text x="644.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Works alongside other</tspan><tspan x="644.0" dy="26">pathways</tspan></text></svg>
