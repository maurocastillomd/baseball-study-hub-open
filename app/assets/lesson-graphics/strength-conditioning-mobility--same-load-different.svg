<svg xmlns="http://www.w3.org/2000/svg" width="900" height="367" viewBox="0 0 900 367" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Equal session-load totals can hide different work</title><desc id="graphic-description">Three fictional sessions yield 60 arbitrary units: 20 minutes at RPE 3, 10 minutes at RPE 6 and 15 minutes at RPE 4. Their ingredients differ.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><text x="30" y="30" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="30" dy="0">AU</tspan></text><text x="30" y="64" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="30" dy="0">0</tspan></text><text x="800" y="64" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle"><tspan x="800" dy="0">60</tspan></text><text x="30" y="91" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="30" dy="0">20 min × RPE 3</tspan></text><rect x="30" y="106" width="770" height="22" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="30" y="106" width="770.0" height="22" rx="5" fill="#286149" stroke="#286149"/><text x="814" y="125" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="814" dy="0">60</tspan></text><text x="30" y="171" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="30" dy="0">10 min × RPE 6</tspan></text><rect x="30" y="186" width="770" height="22" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="30" y="186" width="770.0" height="22" rx="5" fill="#286149" stroke="#286149"/><text x="814" y="205" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="814" dy="0">60</tspan></text><text x="30" y="251" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="30" dy="0">15 min × RPE 4</tspan></text><rect x="30" y="266" width="770" height="22" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="30" y="266" width="770.0" height="22" rx="5" fill="#286149" stroke="#286149"/><text x="814" y="285" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="814" dy="0">60</tspan></text></svg>
