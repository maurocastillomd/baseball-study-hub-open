<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1096" viewBox="0 0 400 1096" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">The box score is one part of the record</title><desc id="graphic-description">Combine official competition, known preparation and athlete response while visibly retaining missing categories.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="352.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Competition</tspan></text><text x="43.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Record official pitches.</tspan></text><rect x="24.0" y="242" width="352.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="259" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="278" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">2</tspan></text><text x="43.0" y="316" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Preparation</tspan></text><text x="43.0" y="360" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Record each known warm-up or</tspan><tspan x="43.0" dy="26">throwing bout.</tspan></text><rect x="24.0" y="460" width="352.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="477" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="496" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">3</tspan></text><text x="43.0" y="534" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Unknowns</tspan></text><text x="43.0" y="578" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Leave missing counts visibly</tspan><tspan x="43.0" dy="26">incomplete.</tspan></text><rect x="24.0" y="678" width="352.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="695" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="714" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">4</tspan></text><text x="43.0" y="752" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Response</tspan></text><text x="43.0" y="796" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Add athlete report and relevant</tspan><tspan x="43.0" dy="26">observations.</tspan></text><rect x="24.0" y="896" width="352.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="913" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="932" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">5</tspan></text><text x="43.0" y="970" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Next task</tspan></text><text x="43.0" y="1014" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Discuss the upcoming baseball</tspan><tspan x="43.0" dy="26">priority.</tspan></text><path d="M200.0 206 L200.0 234" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,234.00 195.03,225.32 204.97,225.32" fill="#286149"/><path d="M200.0 424 L200.0 452" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,452.00 195.03,443.32 204.97,443.32" fill="#286149"/><path d="M200.0 642 L200.0 670" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,670.00 195.03,661.32 204.97,661.32" fill="#286149"/><path d="M200.0 860 L200.0 888" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="200.00,888.00 195.03,879.32 204.97,879.32" fill="#286149"/></svg>
