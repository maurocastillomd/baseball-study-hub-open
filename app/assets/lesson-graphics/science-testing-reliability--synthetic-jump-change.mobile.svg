<svg xmlns="http://www.w3.org/2000/svg" width="400" height="367" viewBox="0 0 400 367" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Two improvements versus the same MDC example</title><desc id="graphic-description">Synthetic changes of 2.0 and 3.5 cm are compared with a stipulated MDC 95 of 2.77 cm. Only 3.5 exceeds that criterion.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><text x="30" y="30" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="30" dy="0">cm</tspan></text><text x="30" y="64" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start"><tspan x="30" dy="0">0</tspan></text><text x="300" y="64" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle"><tspan x="300" dy="0">3.5</tspan></text><text x="30" y="91" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="30" dy="0">Player A change</tspan></text><rect x="30" y="106" width="270" height="22" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="30" y="106" width="154.28571428571428" height="22" rx="5" fill="#286149" stroke="#286149"/><text x="314" y="125" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="314" dy="0">2</tspan></text><text x="30" y="171" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="30" dy="0">MDC95 example</tspan></text><rect x="30" y="186" width="270" height="22" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="30" y="186" width="213.68571428571428" height="22" rx="5" fill="#286149" stroke="#286149"/><text x="314" y="205" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="314" dy="0">2.77</tspan></text><text x="30" y="251" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start"><tspan x="30" dy="0">Player B change</tspan></text><rect x="30" y="266" width="270" height="22" rx="5" fill="#EAF2ED" stroke="#EAF2ED"/><rect x="30" y="266" width="270.0" height="22" rx="5" fill="#286149" stroke="#286149"/><text x="314" y="285" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start"><tspan x="314" dy="0">3.5</tspan></text></svg>
