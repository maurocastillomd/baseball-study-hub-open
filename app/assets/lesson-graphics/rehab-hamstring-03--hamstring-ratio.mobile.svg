<svg xmlns="http://www.w3.org/2000/svg" width="400" height="726" viewBox="0 0 400 726" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Equal legs can still hide unchanged capacity</title><desc id="graphic-description">Fictional force values move from 300 versus 330 to 300 versus 300. Symmetry improves because the other leg declines; involved-leg output is unchanged.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="210" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Earlier</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Involved 300; other 330</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">About 91% symmetry</tspan></text><rect x="24" y="258" width="352.0" height="210" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="258" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="289" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="320" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Later</tspan></text><circle cx="48" cy="373" r="3" fill="#286149"/><text x="60" y="379" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Involved 300; other 300</tspan></text><circle cx="48" cy="422" r="3" fill="#286149"/><text x="60" y="428" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">100% symmetry</tspan></text><rect x="24" y="492" width="352.0" height="210" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="492" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="523" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">03</tspan></text><text x="45" y="554" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Interpretation</tspan></text><circle cx="48" cy="607" r="3" fill="#286149"/><text x="60" y="613" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">No involved-side improvement</tspan></text><circle cx="48" cy="656" r="3" fill="#286149"/><text x="60" y="662" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Do not infer clearance from ratio</tspan></text></svg>
