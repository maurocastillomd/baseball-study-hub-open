<svg xmlns="http://www.w3.org/2000/svg" width="900" height="442" viewBox="0 0 900 442" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">A scan belongs inside the clinical picture</title><desc id="graphic-description">The player describes the task and symptoms; examination and relevant imaging are integrated before choosing the next action.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="405.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Player story</tspan></text><text x="43.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">When, where, and during which task?</tspan></text><rect x="471.0" y="24" width="405.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="489.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="506.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="506.0" dy="0">2</tspan></text><text x="490.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="490.0" dy="0">Examination</tspan></text><text x="490.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="490.0" dy="0">Motion, strength, symptoms, and</tspan><tspan x="490.0" dy="26">relevant tests</tspan></text><rect x="471.0" y="242" width="405.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="489.0" y="259" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="506.0" y="278" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="506.0" dy="0">3</tspan></text><text x="490.0" y="316" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="490.0" dy="0">Imaging context</tspan></text><text x="490.0" y="360" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="490.0" dy="0">Does the finding fit the presentation?</tspan></text><rect x="24.0" y="242" width="405.0" height="176" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="259" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="278" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">4</tspan></text><text x="43.0" y="316" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Next action</tspan></text><text x="43.0" y="360" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Clinician interpretation plus permitted</tspan><tspan x="43.0" dy="26">training</tspan></text><path d="M434.0 112.0 L463.0 112.0" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="463.00,112.00 454.32,116.97 454.32,107.03" fill="#286149"/><path d="M673.5 206 L673.5 234" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="673.50,234.00 668.53,225.32 678.47,225.32" fill="#286149"/><path d="M466.0 330.0 L437.0 330.0" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="437.00,330.00 445.68,325.03 445.68,334.97" fill="#286149"/></svg>
