<svg xmlns="http://www.w3.org/2000/svg" width="900" height="385" viewBox="0 0 900 385" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Three questions often mistaken for one</title><desc id="graphic-description">Rank consistency, absolute detectability and practical value are different interpretations.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">01</tspan></text><text x="45.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45.0" dy="0">Relative reliability</tspan></text><circle cx="48.0" cy="139" r="3" fill="#286149"/><text x="60.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Are ranks consistent?</tspan></text><circle cx="48.0" cy="188" r="3" fill="#286149"/><text x="60.0" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">ICC depends on</tspan><tspan x="60.0" dy="26">sample and model</tspan></text><circle cx="48.0" cy="263" r="3" fill="#286149"/><text x="60.0" y="269" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60.0" dy="0">Not error in centimeters</tspan></text><rect x="316.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="316.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="337.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">02</tspan></text><text x="337.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="337.0" dy="0">Absolute uncertainty</tspan></text><circle cx="340.0" cy="139" r="3" fill="#286149"/><text x="352.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">How large is the noise?</tspan></text><circle cx="340.0" cy="188" r="3" fill="#286149"/><text x="352.0" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">SEM or appropriate</tspan><tspan x="352.0" dy="26">typical error</tspan></text><circle cx="340.0" cy="263" r="3" fill="#286149"/><text x="352.0" y="269" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="352.0" dy="0">MDC adds a stated</tspan><tspan x="352.0" dy="26">criterion</tspan></text><rect x="608.0" y="24" width="268.0" height="337" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="608.0" y="24" width="268.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="629.0" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">03</tspan></text><text x="629.0" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="629.0" dy="0">Practical value</tspan></text><circle cx="632.0" cy="139" r="3" fill="#286149"/><text x="644.0" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Would this change</tspan><tspan x="644.0" dy="26">matter?</tspan></text><circle cx="632.0" cy="214" r="3" fill="#286149"/><text x="644.0" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Define the target</tspan><tspan x="644.0" dy="26">beforehand</tspan></text><circle cx="632.0" cy="289" r="3" fill="#286149"/><text x="644.0" y="295" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="644.0" dy="0">Separate from</tspan><tspan x="644.0" dy="26">detectability</tspan></text></svg>
