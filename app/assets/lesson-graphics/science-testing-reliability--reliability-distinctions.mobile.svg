<svg xmlns="http://www.w3.org/2000/svg" width="400" height="899" viewBox="0 0 400 899" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Three questions often mistaken for one</title><desc id="graphic-description">Rank consistency, absolute detectability and practical value are different interpretations.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="285" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Relative reliability</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Are ranks consistent?</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">ICC depends on sample and</tspan><tspan x="60" dy="26">model</tspan></text><circle cx="48" cy="263" r="3" fill="#286149"/><text x="60" y="269" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Not error in centimeters</tspan></text><rect x="24" y="333" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="333" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="364" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="395" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Absolute uncertainty</tspan></text><circle cx="48" cy="448" r="3" fill="#286149"/><text x="60" y="454" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">How large is the noise?</tspan></text><circle cx="48" cy="497" r="3" fill="#286149"/><text x="60" y="503" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">SEM or appropriate typical error</tspan></text><circle cx="48" cy="546" r="3" fill="#286149"/><text x="60" y="552" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">MDC adds a stated criterion</tspan></text><rect x="24" y="616" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="616" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="647" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">03</tspan></text><text x="45" y="678" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Practical value</tspan></text><circle cx="48" cy="731" r="3" fill="#286149"/><text x="60" y="737" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Would this change matter?</tspan></text><circle cx="48" cy="780" r="3" fill="#286149"/><text x="60" y="786" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Define the target beforehand</tspan></text><circle cx="48" cy="829" r="3" fill="#286149"/><text x="60" y="835" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Separate from detectability</tspan></text></svg>
