<svg xmlns="http://www.w3.org/2000/svg" width="400" height="596" viewBox="0 0 400 596" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Four quantities: keep the questions separate</title><desc id="graphic-description">Force is a push or pull; impulse adds time; power combines force and velocity; RFD describes a force rise over a stated interval.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="262" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Force and impulse</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Force: how large and in which</tspan><tspan x="60" dy="26">direction?</tspan></text><circle cx="48" cy="214" r="3" fill="#286149"/><text x="60" y="220" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Impulse: force accumulated over</tspan><tspan x="60" dy="26">time</tspan></text><rect x="24" y="310" width="352.0" height="262" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="310" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="341" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="372" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Power and RFD</tspan></text><circle cx="48" cy="425" r="3" fill="#286149"/><text x="60" y="431" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Power: force × velocity in one</tspan><tspan x="60" dy="26">direction</tspan></text><circle cx="48" cy="500" r="3" fill="#286149"/><text x="60" y="506" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">RFD: force rise / chosen time</tspan><tspan x="60" dy="26">interval</tspan></text></svg>
