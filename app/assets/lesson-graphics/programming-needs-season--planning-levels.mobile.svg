<svg xmlns="http://www.w3.org/2000/svg" width="400" height="873" viewBox="0 0 400 873" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">One objective, three planning levels</title><desc id="graphic-description">Season, block and session plans contain increasing detail while preserving one objective.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Season map</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Priorities over time</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Calendar constraints</tspan></text><circle cx="48" cy="237" r="3" fill="#286149"/><text x="60" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Development windows</tspan></text><rect x="24" y="307" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="307" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="338" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="369" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Block brief</tspan></text><circle cx="48" cy="422" r="3" fill="#286149"/><text x="60" y="428" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">One primary emphasis</tspan></text><circle cx="48" cy="471" r="3" fill="#286149"/><text x="60" y="477" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Comparable outcome</tspan></text><circle cx="48" cy="520" r="3" fill="#286149"/><text x="60" y="526" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Review date</tspan></text><rect x="24" y="590" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="590" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="621" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">03</tspan></text><text x="45" y="652" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Session dose</tspan></text><circle cx="48" cy="705" r="3" fill="#286149"/><text x="60" y="711" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Exercise and volume</tspan></text><circle cx="48" cy="754" r="3" fill="#286149"/><text x="60" y="760" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Load, intent and rest</tspan></text><circle cx="48" cy="803" r="3" fill="#286149"/><text x="60" y="809" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" tex