<svg xmlns="http://www.w3.org/2000/svg" width="400" height="925" viewBox="0 0 400 925" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">Four questions need different evidence</title><desc id="graphic-description">Description states what happened, association describes co-variation, while prediction and causation need additional design and evaluation.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24" y="24" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="24" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="55" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">01</tspan></text><text x="45" y="86" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Describe and associate</tspan></text><circle cx="48" cy="139" r="3" fill="#286149"/><text x="60" y="145" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">What was measured?</tspan></text><circle cx="48" cy="188" r="3" fill="#286149"/><text x="60" y="194" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">How do variables vary together?</tspan></text><circle cx="48" cy="237" r="3" fill="#286149"/><text x="60" y="243" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Check units, sample and plot</tspan></text><rect x="24" y="307" width="352.0" height="259" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="307" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="338" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">02</tspan></text><text x="45" y="369" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Predict</tspan></text><circle cx="48" cy="422" r="3" fill="#286149"/><text x="60" y="428" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">How well on new observations?</tspan></text><circle cx="48" cy="471" r="3" fill="#286149"/><text x="60" y="477" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Evaluate out-of-sample error</tspan></text><circle cx="48" cy="520" r="3" fill="#286149"/><text x="60" y="526" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Match design to intended use</tspan></text><rect x="24" y="590" width="352.0" height="311" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="24" y="590" width="352.0" height="92" rx="16" fill="#EAF2ED" stroke="#DBE1DD"/><text x="45" y="621" fill="#286149" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="start"><tspan x="45" dy="0">03</tspan></text><text x="45" y="652" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="45" dy="0">Explain causally</tspan></text><circle cx="48" cy="705" r="3" fill="#286149"/><text x="60" y="711" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">What would happen otherwise?</tspan></text><circle cx="48" cy="754" r="3" fill="#286149"/><text x="60" y="760" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Address confounding and</tspan><tspan x="60" dy="26">selection</tspan></text><circle cx="48" cy="829" r="3" fill="#286149"/><text x="60" y="835" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="60" dy="0">Do not infer from correlation</tspan><tspan x="60" dy="26">alone</tspan></text></svg>
