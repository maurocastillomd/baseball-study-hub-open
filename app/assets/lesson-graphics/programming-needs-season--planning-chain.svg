<svg xmlns="http://www.w3.org/2000/svg" width="900" height="494" viewBox="0 0 900 494" role="img" aria-labelledby="graphic-title graphic-description"><title id="graphic-title">From a baseball task to a reviewable plan</title><desc id="graphic-description">A task informs a provisional hypothesis, then a dose, measured response and a revisable decision.</desc><rect width="100%" height="100%" fill="#F7F7F4"/><rect x="24.0" y="24" width="256.0" height="202" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="42.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="59.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="59.0" dy="0">1</tspan></text><text x="43.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="43.0" dy="0">Task</tspan></text><text x="43.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="43.0" dy="0">Name the baseball</tspan><tspan x="43.0" dy="26">contribution.</tspan></text><rect x="322.0" y="24" width="256.0" height="202" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="340.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="357.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="357.0" dy="0">2</tspan></text><text x="341.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="341.0" dy="0">Hypothesis</tspan></text><text x="341.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="341.0" dy="0">Identify a plausible</tspan><tspan x="341.0" dy="26">trainable constraint.</tspan></text><rect x="620.0" y="24" width="256.0" height="202" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="638.0" y="41" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="655.0" y="60" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="655.0" dy="0">3</tspan></text><text x="639.0" y="98" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="639.0" dy="0">Dose</tspan></text><text x="639.0" y="142" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="639.0" dy="0">Specify work within the</tspan><tspan x="639.0" dy="26">real calendar.</tspan></text><rect x="620.0" y="268" width="256.0" height="202" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="638.0" y="285" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="655.0" y="304" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="655.0" dy="0">4</tspan></text><text x="639.0" y="342" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="639.0" dy="0">Response</tspan></text><text x="639.0" y="386" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="639.0" dy="0">Check completion,</tspan><tspan x="639.0" dy="26">tolerance and</tspan><tspan x="639.0" dy="26">measurement.</tspan></text><rect x="322.0" y="268" width="256.0" height="202" rx="16" fill="#FFFFFF" stroke="#DBE1DD"/><rect x="340.0" y="285" width="34" height="26" rx="7" fill="#286149" stroke="#286149"/><text x="357.0" y="304" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle"><tspan x="357.0" dy="0">5</tspan></text><text x="341.0" y="342" fill="#202725" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start"><tspan x="341.0" dy="0">Decision</tspan></text><text x="341.0" y="386" fill="#596660" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="341.0" dy="0">Keep, adjust or</tspan><tspan x="341.0" dy="26">reconsider with an</tspan><tspan x="341.0" dy="26">owner.</tspan></text><path d="M285.0 125.0 L314.0 125.0" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="314.00,125.00 305.32,129.97 305.32,120.03" fill="#286149"/><path d="M583.0 125.0 L612.0 125.0" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="612.00,125.00 603.32,129.97 603.32,120.03" fill="#286149"/><path d="M748.0 232 L748.0 260" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="748.00,260.00 743.03,251.32 752.97,251.32" fill="#286149"/><path d="M615.0 369.0 L586.0 369.0" stroke="#286149" stroke-width="2.5" fill="none"/><polygon points="586.00,369.00 594.68,364.03 594.68,373.97" fill="#286149"/></svg>
